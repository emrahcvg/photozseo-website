name = "photozseo"
pages_build_output_dir = "dist"
compatibility_date = "2024-11-01"

# KV Namespace binding for the P2 storefront registry.
# Created 2026-05-30 on cavusdagins@gmail.com account.
# For local dev, wrangler pages dev uses --kv STORE_KV (emulated, no account needed).
[[kv_namespaces]]
binding = "STORE_KV"
id = "e81c06c817004a22ad3620dcd75e63ac"
preview_id = "6acbd7403ff54e049fb8827a9115ac01"

# Workers AI — storefront on-demand çevirisi (m2m100). Edge'de çalışır, harici key yok.
[ai]
binding = "AI"

# D1 — Marketplace kanonik veritabanı (P1, 2026-05-31).
# Local dev: `wrangler d1 execute MARKET_DB --local` miniflare ile emüle eder, account gerekmez.
# Production D1 oluşturuldu 2026-05-31 (cavusdagins@gmail.com, region EEUR).
[[d1_databases]]
binding = "MARKET_DB"
database_name = "photozseo-marketplace"
database_id = "277c0a85-476e-4b03-a3eb-bf3d60d8f239"
migrations_dir = "migrations"

# R2 — Takım/Ortak Havuz fotoğraf depolama (Faz 2A).
# Local dev: `wrangler pages dev` --r2 POOL_R2 ile emüle eder (account gerekmez).
# Production bucket manuel oluşturulur (Task 11 önkoşulları).
[[r2_buckets]]
binding = "POOL_R2"
bucket_name = "photozseo-team-pool"
preview_bucket_name = "photozseo-team-pool-preview"

# Cron: /api/cron/prune-activity — 365 günlük temizlik (günlük 03:00 UTC)
# Pages'te native cron yok; harici bir cron servisi (cron-job.org gibi) ile GET isteği at.
