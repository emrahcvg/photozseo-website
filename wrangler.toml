name = "photozseo-website"
pages_build_output_dir = "dist"
compatibility_date = "2024-11-01"

# KV Namespace binding for the P2 storefront registry.
# Fill in `id` and `preview_id` after running:
#   npx wrangler kv namespace create STORE_KV
#   npx wrangler kv namespace create STORE_KV --preview
# For local dev, wrangler pages dev uses --kv STORE_KV (emulated, no account needed).
[[kv_namespaces]]
binding = "STORE_KV"
id = "PLACEHOLDER_FILL_AFTER_CREATING_NAMESPACE"
preview_id = "PLACEHOLDER_FILL_AFTER_CREATING_NAMESPACE"
